<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Plant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">

                🌿 Virtual Herbal Garden

            </a>

            <a href="admin.html" class="btn btn-light">

                Dashboard

            </a>

        </div>

    </nav>

    <!-- Add Plant Form -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-lg border-0">

                    <div class="card-header bg-success text-white">

                        <h3 class="mb-0">

                            ➕ Add New Medicinal Plant

                        </h3>

                    </div>

                    <div class="card-body p-4">

                        <form>

                            <div class="mb-3">

                                <label class="form-label">Common Name</label>

                                <input type="text" class="form-control" placeholder="Common Name">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">Scientific Name</label>

                                <input type="text" class="form-control" placeholder="Scientific Name">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">Family</label>

                                <input type="text" class="form-control" placeholder="Plant Family">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">Description</label>

                                <textarea class="form-control" rows="3"></textarea>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">Uses</label>

                                <textarea class="form-control" rows="3"></textarea>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">Benefits</label>

                                <textarea class="form-control" rows="3"></textarea>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">Precautions</label>

                                <textarea class="form-control" rows="3"></textarea>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">Image URL</label>

                                <input type="text" class="form-control" placeholder="Image URL">

                            </div>

                            <button class="btn btn-success w-100">

                                Save Plant

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer class="bg-success text-white text-center p-3">

        © 2026 Virtual Herbal Garden

    </footer>

</body>

</html>
