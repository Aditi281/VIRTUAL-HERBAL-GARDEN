<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Plant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🌿 Virtual Herbal Garden
            </a>

            <a href="admin.html" class="btn btn-light">
                Dashboard
            </a>

        </div>

    </nav>


    <!-- Add Plant Form -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-lg border-0">

                    <div class="card-header bg-success text-white">

                        <h3 class="mb-0">
                            ➕ Add New Medicinal Plant
                        </h3>

                    </div>


                    <div class="card-body p-4">

                        <form id="addPlantForm">

                            <!-- Common Name -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Common Name
                                </label>

                                <input
                                    type="text"
                                    id="common_name"
                                    class="form-control"
                                    value="Rosemary"
                                    required>

                            </div>


                            <!-- Scientific Name -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Scientific Name
                                </label>

                                <input
                                    type="text"
                                    id="scientific_name"
                                    class="form-control"
                                    value="Salvia rosmarinus"
                                    required>

                            </div>


                            <!-- Family -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Family
                                </label>

                                <input
                                    type="text"
                                    id="family"
                                    class="form-control"
                                    value="Lamiaceae"
                                    required>

                            </div>


                            <!-- Description -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Description
                                </label>

                                <textarea
                                    id="description"
                                    class="form-control"
                                    rows="3"
                                    required>Rosemary is an aromatic medicinal herb traditionally used in herbal preparations.</textarea>

                            </div>


                            <!-- Uses -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Uses
                                </label>

                                <textarea
                                    id="uses"
                                    class="form-control"
                                    rows="3"
                                    required>Traditionally used in herbal teas, cooking and preparations for digestion and general wellness.</textarea>

                            </div>


                            <!-- Benefits -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Benefits
                                </label>

                                <textarea
                                    id="benefits"
                                    class="form-control"
                                    rows="3"
                                    required>Contains antioxidant compounds and is traditionally associated with supporting memory, digestion and general wellness.</textarea>

                            </div>


                            <!-- Precautions -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Precautions
                                </label>

                                <textarea
                                    id="precautions"
                                    class="form-control"
                                    rows="3"
                                    required>Use in moderation. Concentrated medicinal preparations should be used with appropriate caution.</textarea>

                            </div>


                            <!-- Image -->

                            <div class="mb-4">

                                <label class="form-label">
                                    Image
                                </label>

                                <input
                                    type="text"
                                    id="image_url"
                                    class="form-control"
                                    value="rosemary.jpg"
                                    required>

                                <small class="text-muted">
                                    Image must be inside frontend/images/
                                </small>

                            </div>


                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-success w-100">

                                Save Plant

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <footer class="bg-success text-white text-center p-3">

        © 2026 Virtual Herbal Garden

    </footer>


    <!-- JavaScript -->

    <script src="js/app.js"></script>

</body>

</html>
