<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🌿 Virtual Herbal Garden
            </a>

            <a href="login.html" class="btn btn-light">
                Logout
            </a>

        </div>

    </nav>

    <!-- Dashboard -->

    <div class="container py-5">

        <div class="text-center mb-5">

            <h2 class="text-success fw-bold">
                Admin Dashboard
            </h2>

            <p class="text-muted">
                Manage medicinal plant information.
            </p>

        </div>

        <div class="row g-4">

            <!-- Total Plants -->

            <div class="col-md-4">

                <div class="card shadow-lg text-center p-4">

                    <h1>🌿</h1>

                    <h3>Total Plants</h3>

                    <h2 class="text-success">30</h2>

                </div>

            </div>

            <!-- Add Plant -->

            <div class="col-md-4">

                <div class="card shadow-lg text-center p-4">

                    <h1>➕</h1>

                    <h3>Add Plant</h3>

                    <a href="addplant.html" class="btn btn-success mt-3">

                        Open Form

                    </a>

                </div>

            </div>

            <!-- Manage Plants -->

            <div class="col-md-4">

                <div class="card shadow-lg text-center p-4">

                    <h1>📋</h1>

                    <h3>Manage Plants</h3>

                    <a href="plants.html" class="btn btn-success mt-3">

                        View Plants

                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer class="bg-success text-white text-center p-3">

        © 2026 Virtual Herbal Garden

    </footer>

</body>

</html>
